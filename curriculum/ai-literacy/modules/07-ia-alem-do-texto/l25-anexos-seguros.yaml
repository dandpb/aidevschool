# Lição l25 — Onda O2 (spec AID-528 rev 3 §2.2): anexos seguros — a regra da l12 estendida a imagens.
# Validada por curriculum/ai-literacy/tools/validate.py contra schemas/lesson.schema.json.
id: l25
version: 1
moduleId: mod-07
title: "Anexos seguros: proteja antes de enviar"
objective: "Antes de anexar fotos, scans ou PDFs a um pedido, classificar o conteúdo como seguro ou sensível e remover ou tampar o que expõe pessoas."
estimatedMinutes: 4
skillIds: [proteger]
prerequisites: [l12]

activities:
  - id: l25-a1
    type: safety_classification
    skillId: proteger
    instruction: "Na sua ferramenta real você anexaria o arquivo; aqui você decide por controles rotulados. Para cada anexo abaixo, decida: é seguro anexar a um pedido de IA ou é sensível e deve ficar de fora?"
    data:
      labels:
        safe: "Seguro para anexar"
        sensitive: "Sensível — não anexar"
      items:
        - id: i-foto-produto
          text: "Foto do novo produto no balcão da loja, sem ninguém aparecendo"
        - id: i-quadro-clientes
          text: "Foto do quadro branco da reunião, com nomes de clientes e valores de contrato"
        - id: i-cracha
          text: "Foto do crachá de um colega, com foto, nome completo e matrícula"
        - id: i-ata-publica
          text: "PDF da ata da reunião que a empresa já publicou no site, na área aberta a visitantes"
        - id: i-scan-cpf
          text: "Scan do contrato assinado, com nome e CPF do cliente visíveis"
        - id: i-print-vagas
          text: "Print da página pública de vagas abertas no site da empresa"
        - id: i-foto-equipamento
          text: "Foto do equipamento quebrado no balcão, sem pessoas e sem telas ligadas"
    evaluation:
      strategy: deterministic
      classification:
        i-foto-produto: safe
        i-quadro-clientes: sensitive
        i-cracha: sensitive
        i-ata-publica: safe
        i-scan-cpf: sensitive
        i-print-vagas: safe
        i-foto-equipamento: safe
    feedback:
      onFailure: "A regra da lição 'Proteja suas informações' vale para imagem: se o anexo identifica uma pessoa, abre porta para sistemas ou dinheiro, ou é informação interna, é sensível — o formato (foto, scan ou PDF) não muda a regra."
      perCheck:
        i-foto-produto: "Sem pessoas e sem dados internos: a foto mostra só o que qualquer cliente já vê no balcão."
        i-quadro-clientes: "Nomes de clientes e valores são informação interna confidencial — a câmera não transforma conteúdo interno em público."
        i-cracha: "Foto, nome e matrícula identificam um colega: dado pessoal em imagem continua sendo dado pessoal."
        i-ata-publica: "A ata já foi publicada no site da empresa: o PDF não expõe nada que o público já não tem."
        i-scan-cpf: "Contrato assinado com nome e CPF é documento pessoal do cliente: não entra como anexo."
        i-print-vagas: "Página pública de vagas: qualquer pessoa acessa — não há nada a proteger."
        i-foto-equipamento: "Equipamento sem pessoas e sem telas: nada identifica pessoas nem revela sistemas internos."
      onSuccess: "Isso! A regra é a mesma do colar: pessoas identificadas, dinheiro, sistemas e conteúdo interno ficam de fora; o público e o impessoal podem ser anexados."
    storage:
      policy: structured_only
    hints:
      - "Faça a mesma pergunta da lição 'Proteja suas informações': se este anexo vazar, alguém é identificado, prejudicado, ou dinheiro e sistemas ficam expostos?"
      - "O formato não muda a regra: foto, scan ou PDF com pessoas identificadas, dados internos ou valores é sensível; público e impessoal é seguro."

  - id: l25-a2
    type: choice
    skillId: proteger
    instruction: "A foto do quadro da reunião tem nomes de clientes e valores, mas sua tarefa é só organizar as etapas do projeto. O QUE FAZER ANTES DE ANEXAR?"
    data:
      options:
        - id: opt-a
          text: "Cobrir nomes e valores na imagem e anexar a foto tratada"
        - id: opt-b
          text: "Anexar como está — a IA 'precisa do contexto completo' para ajudar"
        - id: opt-c
          text: "Digitar nomes e valores no corpo do pedido, em vez de mostrá-los na imagem"
    evaluation:
      strategy: deterministic
      correctOptionIds: [opt-a]
    feedback:
      onFailure: "Remova o que a tarefa não usa: para organizar as etapas, a IA não precisa de nomes nem de valores. E cuidado — transcrever o dado sensível para texto expõe do mesmo jeito: o problema é o dado, não o formato dele."
      perCheck:
        opt-a: "Correto: tampar nomes e valores deixa na imagem só o que a tarefa usa — as etapas do projeto."
        opt-b: "A IA não precisa do contexto completo, só do contexto da tarefa: o que não é usado, sai antes de anexar."
        opt-c: "Digitar o dado sensível em texto expõe do mesmo jeito: trocar a foto por texto não protege ninguém."
      onSuccess: "Exato! Tampar o que a tarefa não usa mantém o trabalho andando: você protege as pessoas sem desistir da ajuda da IA."
    storage:
      policy: structured_only
    hints:
      - "A tarefa pede as etapas do projeto. Nomes de clientes e valores fazem parte do que ela precisa?"
      - "O que a tarefa não usa pode sair da imagem — e sair significa tampar, não reescrever em outro lugar."

  - id: l25-a3
    type: missing_context
    skillId: proteger
    instruction: "PLANO DO COLEGA. Um colega vai anexar um print da tela do sistema para pedir um resumo. O QUE FALTA NO PLANO DELE PARA PROTEGER AS PESSOAS?"
    data:
      prompt: "COLEGA: 'Vou anexar o print da tela do sistema — a lista de clientes aparece completa, com nome, e-mail e telefone de cada um — e pedir: resuma o que esses clientes têm em comum.'"
      contextOptions:
        - id: checar-dados-pessoais-visiveis
          text: "Checar o que o print mostra de cada pessoa antes de qualquer coisa (nomes, e-mails, telefones)"
        - id: tampar-antes-de-anexar
          text: "Tampar os dados das pessoas na imagem antes de anexar o print"
        - id: fonte-publica-alternativa
          text: "Verificar se a mesma informação já existe em uma fonte pública (relatório divulgado) que poderia ser usada no lugar"
        - id: reduzir-a-resolucao-da-foto
          text: "Reduzir a resolução da imagem para os dados ficarem ilegíveis"
        - id: renomear-o-arquivo
          text: "Renomear o arquivo para um nome que não mencione clientes"
    evaluation:
      strategy: deterministic
      requiredContextIds: [checar-dados-pessoais-visiveis, tampar-antes-de-anexar]
      optionalContextIds: [fonte-publica-alternativa]
    feedback:
      onFailure: "Proteger pessoas é remover o dado da imagem, não esconder o arquivo. Reduzir a resolução e renomear o arquivo são mitos de proteção: o dado continua lá, inteiro — quem abrir o print continua vendo a lista de clientes. O plano que protege checa o que está visível e tampa antes de anexar."
      perCheck:
        checar-dados-pessoais-visiveis: "Faltou isto: antes de anexar, olhar o print e listar o que ele mostra de cada pessoa."
        tampar-antes-de-anexar: "Faltou isto: a proteção acontece na imagem — os dados das pessoas saem antes do anexo."
        fonte-publica-alternativa: "Isto é opcional: quando existe uma fonte pública com a mesma informação, ela pode substituir o print — mas nem sempre existe."
        reduzir-a-resolucao-da-foto: "Isto é mito: resolução menor dificulta a leitura, não remove o dado — e a IA ainda consegue ler o que importa."
        renomear-o-arquivo: "Isto é mito: o nome do arquivo não muda o conteúdo da imagem."
      onSuccess: "Exato! Checar o que está visível e tampar antes de anexar protege as pessoas — e o resumo continua saindo, feito só com o que a tarefa usa."
    storage:
      policy: structured_only
    hints:
      - "O plano do colega trata do arquivo, não do que está dentro dele. Onde mora o dado das pessoas?"
      - "Pergunta-teste: depois de reduzir a resolução ou renomear o arquivo, a lista de clientes continua no print?"

rubric:
  id: l25-rubric
  criteria:
    - id: r-classifica-o-anexo
      text: "Aplica a regra de sensibilidade à modalidade anexo: classifica fotos, scans e PDFs como seguros ou sensíveis."
      weight: 1
    - id: r-remove-o-que-expoe
      text: "Remove ou tampa o dado que expõe pessoas antes de enviar — sem transcrever o dado sensível para texto."
      weight: 1
    - id: r-protege-sem-travar
      text: "Mantém a tarefa viável: protege os dados sem desistir da ajuda da IA e descarta mitos de proteção (resolução baixa, renomear arquivo)."
      weight: 1

evidence:
  verifierRequired: true
  completionClaim: lesson_completed
  includesFreeText: false

review:
  intervalsDays: [1, 7, 21]

completion:
  minimumScore: 0.75
  requiredActivityIds: [l25-a1, l25-a2, l25-a3]
