# Lição l22 — Onda dev l21–l23 (spec AID-528 rev 2 §2.2): revisar código sugerido como engenheiro.
# Validada por curriculum/ai-literacy/tools/validate.py contra schemas/lesson.schema.json.
id: l22
version: 1
moduleId: mod-05
title: "Revise o código sugerido como engenheiro"
objective: "Diante de código sugerido por assistente, aplicar critérios objetivos de engenharia, separar o que aceita do que recusa com motivo e revisar comportamento antes de estilo."
estimatedMinutes: 5
skillIds: [codificar, avaliar]
prerequisites: [l16]

activities:
  - id: l22-a1
    type: rubric_review
    skillId: codificar
    instruction: "O ASSISTENTE SUGERIU ESTA FUNÇÃO DE REENVIO DE WEBHOOK. AVALIE CADA CRITÉRIO: ATENDIDO, PARCIALMENTE ATENDIDO OU NÃO ATENDIDO?"
    data:
      responseText: |
        // Reenvia o webhook do pagamento até dar certo
        export async function reenviarWebhook(url, payload) {
          let tentativa = 0;
          while (true) {
            try {
              const resposta = await fetch(url, {
                method: "POST",
                headers: { "content-type": "application/json" },
                body: JSON.stringify(payload),
              });
              console.log("status do webhook:", resposta.status);
              if (resposta.ok) {
                return resposta.status;
              }
            } catch (erro) {
              // segue para a próxima tentativa
            }
            tentativa += 1;
            await dormir(500);
          }
        }

        function dormir(ms) {
          return new Promise((resolver) => setTimeout(resolver, ms));
        }
      criteria:
        - id: c-trata-erros
          text: "Falhas são tratadas de forma previsível — log ou retorno, nunca engolidas"
        - id: c-limita-tentativas
          text: "Tem teto de tentativas e backoff"
        - id: c-nomes-claros
          text: "Nomes e estrutura legíveis"
        - id: c-escopo-minimo
          text: "Faz só o que foi pedido, sem comportamento invisível extra"
        - id: c-dependencias
          text: "Dependências declaradas"
    evaluation:
      strategy: deterministic
      expectedVerdicts:
        c-trata-erros: not_met
        c-limita-tentativas: not_met
        c-nomes-claros: met
        c-escopo-minimo: partial
        c-dependencias: met
    feedback:
      onFailure: "Revisar código sugerido é aplicar critérios, um por um: erro, limite, escopo, dependência, leitura. Releia o trecho contra cada critério antes de decidir."
      perCheck:
        c-trata-erros: "O catch vazio engole o erro: a falha fica invisível — ninguém sabe que o reenvio está morrendo. Previsível é logar ou retornar, não seguir em silêncio."
        c-limita-tentativas: "O retry sem teto pode rodar para sempre: while(true) com sleep fixo de 500ms não tem backoff nem limite — um endpoint caído vira loop infinito."
        c-escopo-minimo: "O console.log de status não foi pedido: log extra é comportamento invisível — por isso parcial, não atendido por inteiro."
      onSuccess: "Avaliação precisa: nomes legíveis e zero dependência externa valem reconhecimento — e o catch vazio com retry sem teto valem recusa. É isso que engenheiro sênior faz com código de assistente: critério por critério."
    storage:
      policy: structured_only
    hints:
      - "Siga o fluxo de falha: o que acontece quando o fetch lança? E quando o endpoint fica fora do ar por uma hora?"
      - "Procure comportamento que ninguém pediu — todo log a mais é decisão tomada por você não."
      - "Dois critérios estão plenamente atendidos: leia os nomes e conte as dependências externas."

  - id: l22-a2
    type: output_comparison
    skillId: avaliar
    instruction: "DOIS DEVS REVISARAM O MESMO CÓDIGO DE RETRY. COMPARE AS REVISÕES E ESCOLHA A MAIS ÚTIL ANTES DO MERGE."
    data:
      scenario: "A mesma função de reenvio de webhook com catch vazio e retry sem teto passou por duas revisões. Qual revisão protege o time?"
      outputs:
        - id: out-a
          text: "Conferi contra nossos critérios: o catch vazio engole erros (a falha fica invisível) e o while(true) não tem teto de tentativas nem backoff (endpoint caído vira loop infinito). Recuso enquanto esses dois não forem corrigidos — com erro logado, teto e backoff, aprovo."
        - id: out-b
          text: "Aprovo: passou no lint, o código está limpo e os nomes estão claros. Pode dar merge."
      criteria:
        - id: c-verifica-contra-criterios
          text: "Verifica o código contra critérios explícitos de comportamento"
        - id: c-aponta-defeito-real
          text: "Aponta defeitos concretos com consequência nomeada"
        - id: c-justifica-a-decisao
          text: "Justifica aceitar ou recusar com motivo verificável"
    evaluation:
      strategy: deterministic
      betterOutputId: out-a
      requiredCriterionIds: [c-verifica-contra-criterios, c-aponta-defeito-real]
    feedback:
      onFailure: "Revisão que aceita sem ler é aprovação estética — lint limpo não prova comportamento. A revisão A nomeia o defeito, a consequência e a condição de aceite; a B confunde estilo com correção."
      perCheck:
        betterOutputId: "A revisão A é acionável: diz o que está errado, o que acontece em produção e o que muda o veredito. A B só atesta aparência."
        c-verifica-contra-criterios: "Faltou este critério: revisão útil compara o código com regras explícitas (erro tratado? teto? escopo?), não com impressão."
        c-aponta-defeito-real: "Faltou este critério: catch vazio e retry sem teto são defeitos com consequência nomeada — invisibilidade de falha e loop infinito."
      onSuccess: "Exato! Revisão de engenheiro verifica contra critérios, aponta defeito com consequência e condiciona o aceite. Lint e aparência não são evidência de comportamento."
    storage:
      policy: structured_only
    hints:
      - "Qual revisão você conseguiria agir amanhã de manhã sem reler o código?"
      - "Procure a consequência nomeada do defeito: 'engole erro' e 'loop infinito' são acionáveis; 'limpo' não é."

  - id: l22-a3
    type: sort
    skillId: codificar
    instruction: "ORDENE UMA REVISÃO ÚTIL: QUAL A SEQUÊNCIA DE PASSOS DE UM CÓDIGO SUGERIDO ATÉ O VEREDITO?"
    data:
      items:
        - id: step-reler
          text: "Reler o pedido original para saber a intenção do código"
        - id: step-inspecionar
          text: "Inspecionar o comportamento nas bordas e no erro"
        - id: step-conferir
          text: "Conferir dependências e escopo invisível (o que o código faz além do pedido)"
        - id: step-estilo
          text: "Só então opinar sobre estilo e nomes"
    evaluation:
      strategy: deterministic
      expectedOrder: [step-reler, step-inspecionar, step-conferir, step-estilo]
    feedback:
      onFailure: "A ordem certa é: intenção, comportamento, dependências e escopo, estilo. Comportamento vem antes de estilo — nome bonito em código que engole erro não aprova nada."
      perCheck:
        step-reler: "Primeiro a intenção: sem reler o pedido, não dá para saber o que é defeito e o que é decisão."
        step-inspecionar: "Depois o comportamento: bordas e erro são onde código de assistente quebra de verdade."
        step-conferir: "Então o invisível: dependência não declarada e escopo extra são risco que a leitura rápida não pega."
        step-estilo: "Por último o estilo: importa — depois que o comportamento está garantido."
      onSuccess: "Isso! Intenção, comportamento, escopo, estilo — a ordem que separa revisão de engenharia de revisão estética."
    storage:
      policy: structured_only
    hints:
      - "O que você precisa saber ANTES de julgar qualquer linha: o que o código deveria fazer?"
      - "Estilo é o único passo que pode esperar — qual é o primeiro que não pode?"

rubric:
  id: l22-rubric
  criteria:
    - id: r-aplica-criterios
      text: "Revisa código sugerido com critérios explícitos de engenharia, não pela aparência."
      weight: 1
    - id: r-separa-o-que-aceita
      text: "Separa o que aceita do que recusa com motivo verificável."
      weight: 1
    - id: r-ordena-a-revisao
      text: "Revisa comportamento nas bordas e no erro antes de estilo e nomes."
      weight: 1

evidence:
  verifierRequired: true
  completionClaim: lesson_completed
  includesFreeText: false

review:
  intervalsDays: [1, 7, 21]

completion:
  minimumScore: 0.75
  requiredActivityIds: [l22-a1, l22-a2, l22-a3]
