schemaVersion: 1
id: literacy-happy-path
useCaseId: literacy-standalone-first-lesson
kind: happy-path
execution: mixed
startState: fresh-browser-profile
steps:
  - open-supported-entry
  - complete-five-step-onboarding
  - open-first-lesson
  - submit-correct-attempt
  - finish-lesson
  - identify-next-lesson
assertions:
  - id: lesson-result-is-local-completion
    severity: high
    evidence: playwright
    claim: The result is saved as local completion and never presented as canonical mastery.
  - id: learner-can-name-next-action
    severity: high
    evidence: observation
    claim: The learner can identify the next available lesson without repository knowledge.
automation:
  workingDirectory: engines/literacyDojo
  argv: [npm, run, test:e2e]
sourcePaths:
  - engines/literacyDojo/playwright/vertical-slice.spec.ts
  - engines/literacyDojo/src/domain/progress.ts
