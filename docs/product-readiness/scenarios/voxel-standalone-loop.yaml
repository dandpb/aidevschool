schemaVersion: 1
id: voxel-standalone-loop
useCaseId: voxel-standalone-learning-loop
kind: happy-path
execution: mixed
startState: selected-catalog-game
steps: [launch-declared-game, complete-deterministic-loop, inspect-evidence, identify-verifier-handoff]
assertions:
  - id: each-declared-game-runs-its-browser-smoke
    severity: critical
    evidence: playwright
    claim: Every package in the declared catalog scope runs its own smoke and emits raw evidence.
  - id: learner-understands-game-specific-scope
    severity: high
    evidence: observation
    claim: The learner understands that one passing game does not validate sibling games or grant mastery.
automation:
  workingDirectory: engines/voxelDojo
  argv: [pnpm, run, smoke]
sourcePaths: [engines/voxelDojo/catalog.json, engines/voxelDojo/game-02-warehouse/playwright/]
