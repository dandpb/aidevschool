schemaVersion: 1
id: os-onboarding-track-choice
useCaseId: os-returning-learner
kind: happy-path
execution: mixed
startState: fresh-browser-profile
steps: [open-os, review-recommended-track, accept-or-change-track, enter-school]
assertions:
  - id: learner-enters-chosen-track
    severity: high
    evidence: playwright
    claim: The host opens the chosen or recommended track and presents its next mission.
  - id: learner-can-explain-track-choice
    severity: high
    evidence: observation
    claim: The learner can state which track was selected and what action comes next.
automation:
  workingDirectory: engines/codexdojo-os-prototype
  argv: [npm, run, test:readiness]
sourcePaths: [engines/codexdojo-os-prototype/tests-pilot/pilot-build.smoke.spec.ts, engines/codexdojo-os-prototype/src/journey/]
