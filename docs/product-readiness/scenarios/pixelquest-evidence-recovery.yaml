schemaVersion: 1
id: pixelquest-evidence-recovery
useCaseId: pixelquest-evidence-encounter
kind: recovery
execution: mixed
startState: completed-encounter-with-missing-or-invalid-evidence
steps: [inspect-evidence-channel, replay-encounter, validate-new-record, stop-if-still-missing]
assertions:
  - id: replay-recovers-evidence-without-state-promotion
    severity: critical
    evidence: document-review
    claim: Replaying can emit new raw evidence without writing canonical learner state.
  - id: missing-evidence-does-not-count-as-completion
    severity: high
    evidence: observation
    claim: The learner and facilitator do not substitute a screenshot or game status for evidence.
automation:
  workingDirectory: engines/pixelDojo
  argv: [pnpm, run, smoke]
sourcePaths: [engines/pixelDojo/pixel-quest/playwright/pixel-quest.spec.ts, engines/pixelDojo/pixel-quest/src/game/evidence/emitter.ts]
