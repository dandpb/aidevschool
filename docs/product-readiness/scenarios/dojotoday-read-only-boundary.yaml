schemaVersion: 1
id: dojotoday-read-only-boundary
useCaseId: dojotoday-daily-guidance
kind: recovery
execution: mixed
startState: stale-or-unavailable-generated-projection
steps: [identify-stale-view, regenerate-projection, reload-view, stop-if-source-unavailable]
assertions:
  - id: regeneration-preserves-read-only-boundary
    severity: critical
    evidence: document-review
    claim: Recovery regenerates the projection without dojoToday writing learner state or mastery.
  - id: stale-guidance-has-bounded-exit
    severity: high
    evidence: observation
    claim: The facilitator can stop rather than presenting stale guidance as current.
automation:
  workingDirectory: engines/dojoToday
  argv: [npm, run, selfcheck]
sourcePaths: [engines/dojoToday/tools/selfcheck.py, learner/substrate/]
