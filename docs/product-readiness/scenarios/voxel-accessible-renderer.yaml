schemaVersion: 1
id: voxel-accessible-renderer
useCaseId: voxel-standalone-learning-loop
kind: recovery
execution: mixed
startState: constrained-or-unavailable-webgl
steps: [detect-renderer-failure, use-declared-accessible-projection, complete-core-interaction, stop-if-unsupported]
assertions:
  - id: accessible-projection-preserves-supported-interaction
    severity: high
    evidence: document-review
    claim: The declared accessible projection preserves the supported learning interaction and evidence boundary.
  - id: unsupported-renderer-has-honest-exit
    severity: high
    evidence: observation
    claim: The learner can stop without a false completion or readiness claim when no supported renderer works.
automation:
  workingDirectory: engines/voxelDojo
  argv: [pnpm, run, smoke]
sourcePaths: [engines/voxelDojo/shared/accessibleProjection.ts, engines/voxelDojo/shared/accessibleProjection.test.ts]
