schemaVersion: 1
id: literacy-resume
useCaseId: literacy-standalone-first-lesson
kind: continuity
execution: mixed
startState: returning-browser-profile
steps:
  - complete-onboarding-and-lesson
  - reload-the-application
  - confirm-onboarding-remains-complete
  - open-the-next-available-lesson
assertions:
  - id: same-device-progress-resumes
    severity: high
    evidence: playwright
    claim: Reloading on the same browser preserves supported local progress and the next available lesson.
  - id: learner-understands-device-boundary
    severity: high
    evidence: observation
    claim: The learner understands that clearing browser data or changing devices can remove local progress.
automation:
  workingDirectory: engines/literacyDojo
  argv: [npm, run, test:e2e]
sourcePaths:
  - engines/literacyDojo/playwright/vertical-slice.spec.ts
  - engines/literacyDojo/src/adapters/indexedDbProgressRepository.ts
