schemaVersion: 1
policyVersion: 2
publicationGate:
  introducedBy: AID-6005 (triage aprovada pelo founder em 2026-11-01)
  rule: >-
    No surface ships a public URL unless every requirement below holds at publication time;
    without them the surface stays local. The launch set is two public URLs
    (codexDojo OS and LiteracyDojo); dojoToday is a declared secondary companion route,
    out of launch marketing; voxelDojo standalone, PixelQuest, and miniTown run locally.
  requirements:
    - customer-ready use case in inventory.yaml whose entry route points at the public route
    - promoted deploy-to-pin binding with receipt
    - learner-facing title and copy (not engine-facing)
    - named owner
tiers:
  customer-ready:
    requiredScenarioKinds: [happy-path, recovery, continuity]
    requiredEvidenceKinds: [playwright, observation]
    requiredManuals: [student, facilitator]
  validated-journey:
    requiredScenarioKinds: [happy-path, recovery]
    requiredEvidenceKinds: [playwright, observation]
    requiredManuals: [student, facilitator]
  experimental:
    requiredScenarioKinds: [happy-path]
    requiredEvidenceKinds: [playwright]
    requiredManuals: [student, facilitator]
severities:
  critical:
    treatment: block
  high:
    treatment: block
  medium:
    treatment: disposition-required
  low:
    treatment: disposition-required
outcomes:
  - pass
  - conditional-follow-up
  - downgraded
  - blocked
  - stale
  - unassessed
freshness:
  requiresExplicitRevalidateBy: true
  invalidatingChanges:
    - entry-route
    - onboarding
    - persistence
    - evidence-semantics
    - recovery
    - accessibility
    - facilitator-procedure
