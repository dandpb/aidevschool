name: CI

# Enforcement spine (TECH_DEBT_AUDIT_2026-06-28.md, D2): lint + test + build on
# every push / PR. The project's "no claims without evidence" rule needs a
# machine that actually runs the suites. TS engines and the Python substrate are
# blocking. The remaining Go/Rust implementations are small, active pilots and
# therefore enforce formatting, static checks, and tests as well.

# Push runs only on main (agent-generated feature branches were burning the full
# matrix on every push — TECH_DEBT_AUDIT_2026-07-08 item 15); PRs still run everywhere.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  # AID-537 (audit AID-400 Registro #4): the SDLC guardrail hooks
  # (.claude/hooks/protect-paths|protect-tests|guard-commands) only execute in
  # Claude Code sessions, while every agent in this company runs on other
  # runtimes — so the guardrails were inert for the runtimes actually in use.
  # This job replays the canonical hook scripts against the committed diff,
  # which enforces the policy no matter which runtime (or human) produced the
  # change. The self-test step fails the job if synthetic violations ever stop
  # being detected. Overrides: owner-approved commit trailers
  # SDLC-ALLOW-TEST-EDIT / SDLC-ALLOW-DERIVED-EDIT (see docs/sdlc/README.md
  # §Guardrails); the credential rule has no override.
  sdlc-guards:
    name: SDLC guardrails (diff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: resolve comparison base
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            # AID-1272: pull_request.base.sha is frozen at PR creation. Once
            # main advances and the PR merges it, that stale base turned the
            # diff range cumulative and a MODIFIED test showed as ADDED
            # (new-test-allowed) at head, only going red on the main push
            # after merge. Compare against the CURRENT base branch tip
            # (fetch-depth: 0 fetched all refs, so origin/<base.ref> resolves).
            BASE="origin/${{ github.event.pull_request.base.ref }}"
          else
            BASE="${{ github.event.before }}"
          fi
          if git rev-parse --verify -q "${BASE}^{commit}" >/dev/null 2>&1; then
            echo "SDLC_BASE=$BASE" >> "$GITHUB_ENV"
          else
            echo "SDLC_BASE=" >> "$GITHUB_ENV"
            echo "::warning::comparison base '$BASE' not fetchable (initial push?) — running self-test only"
          fi
      - name: guardrail self-test (synthetic violations must fail)
        run: scripts/sdlc_guard_check.sh --self-test
      - name: guardrail check (changed files vs base)
        run: |
          if [ -n "$SDLC_BASE" ]; then
            scripts/sdlc_guard_check.sh --base "$SDLC_BASE"
          fi

  # AID-1556 (audit AID-1526 §3.1, P1): the promotion precheck lives in
  # scripts/precheck/ as a versioned baseline with per-wave anchor configs,
  # replacing the copy-per-wave scripts that drifted between waves. This job
  # runs the offline self-test (synthetic violations must fail, same contract
  # as the sdlc-guard self-test above) and a dry-run of the anchor wave
  # config, so registry/config drift breaks CI before it can reach a
  # promotion wave. No network, no dependencies.
  precheck-baseline:
    name: Promotion precheck baseline (self-test + dry-run)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: precheck self-test (synthetic violations must fail)
        run: node scripts/precheck/precheck.mjs --self-test
      - name: anchor wave dry-run (offline plan + registry validation)
        run: node scripts/precheck/precheck.mjs --wave scripts/precheck/waves/AID-935-65d64bca.json --dry-run

  codexdojo:
    name: codexDojo (TS)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: engines/codexDojo
    steps:
      - uses: actions/checkout@v4
      # Install pnpm without scanning a monorepo workspace at repo root
      # (standalone engines; no root package.json / pnpm-workspace.yaml).
      - uses: pnpm/action-setup@v4
        with:
          version: 9
          package_json_file: engines/codexDojo/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: engines/codexDojo/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build

  pixeldojo:
    name: pixelDojo (TS)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: engines/pixelDojo
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: engines/pixelDojo/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: engines/pixelDojo/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm typecheck
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      # AID-1658 (hardening-top10 R7): extends the AID-571 deterministic
      # Playwright retry policy to pixelDojo. The smoke script is expanded
      # here (recursive per-package run + readiness report) so the flags land
      # on `playwright test` itself — appending them to `pnpm smoke` would
      # hand them to readiness-report.mjs instead. A retried test surfaces as
      # a named "flaky" entry in this log plus its on-first-retry trace
      # (durable via the artifact upload below); a real regression fails
      # twice and still fails the job. Recurrence on the same test escalates
      # to quarantine + issue (do not raise retries). Local stays retries: 0.
      - run: pnpm -r --if-present run smoke --retries=1 --trace on-first-retry
      - run: READINESS_TEST_RUN=passed node scripts/readiness-report.mjs
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: pixeldojo-readiness-${{ github.sha }}
          path: |
            engines/pixelDojo/test-results
            engines/pixelDojo/pixel-quest/test-results
          if-no-files-found: warn

  voxeldojo:
    name: voxelDojo (TS)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: engines/voxelDojo
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: engines/voxelDojo/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: engines/voxelDojo/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      # Root scripts include shared accessibility/evidence checks that a raw
      # recursive invocation would skip.
      - run: pnpm test
      # AID-1673 (hardening-top10 R3): direct suite for @aidevschool/evidence,
      # the golden-rule primitive shared by pixelDojo, voxelDojo and dojoToday.
      # The package declares no dependencies, so this step only needs this
      # workspace's vitest install plus the package's own config. Pins the
      # BUG_AUDIT_2026-07-19 #33/#34 regression classes (append-only channels,
      # invalid-envelope / non-ISO-ts rejection); mutation proof documented in
      # engines/shared/teaching-evidence/README.md.
      - run: pnpm exec vitest run -c ../shared/teaching-evidence/vitest.config.ts --reporter=verbose
      - run: pnpm typecheck
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      # AID-1658 (hardening-top10 R7): AID-571 deterministic retry policy for
      # the workspace-wide smoke sweep (script expanded here so the flags land
      # on each game's `playwright test`, not on readiness-report.mjs). A
      # retried test surfaces as a named "flaky" entry in this log plus its
      # on-first-retry trace (durable via the artifact upload below); a real
      # regression fails twice and still fails the job. Recurrence on the same
      # test escalates to quarantine + issue (do not raise retries).
      - run: pnpm -r --if-present run smoke --retries=1 --trace on-first-retry
      - run: READINESS_TEST_RUN=passed node scripts/readiness-report.mjs
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: voxeldojo-readiness-${{ github.sha }}
          path: |
            engines/voxelDojo/test-results
            engines/voxelDojo/game-*/test-results
          if-no-files-found: warn

  codexdojo-os:
    name: codexdojo-os (TS)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: engines/codexdojo-os-prototype
    steps:
      - uses: actions/checkout@v4
      # The integrated OS bridge dispatches fixed, independent Python verifiers.
      # Jobs are isolated, so the Python job cannot prepare this runtime for us.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: pnpm/action-setup@v4
        with:
          version: 9
          package_json_file: engines/codexDojo/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: engines/codexdojo-os-prototype/package-lock.json
      - run: npm ci
      # §5.2 (AID-1738, ORDEM AID-1714/r3-B): the cross-engine integration
      # steps that used to live inline below moved to the named harness
      # scripts/integration/cross-engine.sh (contract: scripts/integration/
      # README.md). The harness owns the integration contract with CI-identical
      # argv and phase ORDER (deps → unit lint/test → contracts → blobs →
      # drift → build → smoke → report; the OS unit tests spawn the Python
      # bridge verifiers, so the substrate install must precede them) and is
      # first-class locally; this job keeps id/name so the required check
      # `codexdojo-os (TS)` is unchanged, and only orchestrates.
      # INTEGRATION_PLAYWRIGHT_RETRIES=1 is the deterministic retry policy
      # (AID-571/AID-1658): local runs default to 0.
      - name: cross-engine integration harness (scripts/integration)
        run: bash ../../scripts/integration/cross-engine.sh --skip-self-install
        env:
          INTEGRATION_PLAYWRIGHT_RETRIES: "1"
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: codexdojo-os-readiness-${{ github.sha }}
          path: |
            engines/codexdojo-os-prototype/test-results
            engines/codexdojo-os-prototype/test-results-pilot
          if-no-files-found: warn

  # The suites of the former monolithic `python` job now run as per-engine
  # split jobs (minimaxDojo / miniMaxEvolutionEngine / aiDevschoolMvp /
  # openclaw below; TECH_DEBT_AUDIT_2026-07-08 item 8) plus this job for the
  # shared learner/curriculum remainder, so no suite runs twice.
  learner:
    name: Python (learner + curriculum shared)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
      # AID-1636 (hardening-top10 R4, fila QA-approved rev2 AID-1586):
      # scripts/check_python_complexity.py (radon >=6,<7 from [dev]) was the
      # charter's complexity ruler but ran nowhere — debt grew invisible.
      # Self-test first (synthetic over-complex function must fail the gate),
      # then the real check: new violations fail CI; the frozen baseline at
      # scripts/python_complexity_baseline.txt waives the 107 pre-existing
      # entries and must shrink when complexity drops (stale entries fail).
      - name: python complexity gate self-test (synthetic violations must fail)
        run: python3 scripts/check_python_complexity.py --self-test
      - name: python complexity gate (max 8, ratchet vs frozen baseline)
        run: python3 scripts/check_python_complexity.py --max 8 --baseline scripts/python_complexity_baseline.txt learner engines/minimaxDojo engines/openclaw engines/miniMaxEvolutionEngine engines/aiDevschoolMvp
      - run: python -m pytest learner/substrate/tests learner/gate/tests learner/tests curriculum/_shared/tests curriculum/ai-literacy/tools/tests engines/test_engine_contracts.py -q

  literacydojo:
    name: literacyDojo (TS + content)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: engines/literacyDojo
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: engines/literacyDojo/package-lock.json
      - run: python -m pip install -e ../..
      - run: npm ci
      - run: npm run lint
      - run: npm run test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      # AID-1658 (hardening-top10 R7): AID-571 deterministic retry policy for
      # the literacyDojo e2e suite (test:e2e expanded here so the flags land
      # on `playwright test` itself). A retried test surfaces as a named
      # "flaky" entry in this log plus its on-first-retry trace (durable via
      # the artifact upload below); a real regression fails twice and still
      # fails the job. Recurrence on the same test escalates to quarantine +
      # issue (do not raise retries). Local stays retries: 0.
      - run: npx playwright test --retries=1 --trace on-first-retry
      - run: READINESS_TEST_RUN=passed node scripts/readiness-report.mjs
      # This report contains automated facts only; observation assertions stay
      # with the independent assessor and cannot grant readiness in CI.
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: literacydojo-readiness-${{ github.sha }}
          path: engines/literacyDojo/test-results
          if-no-files-found: warn

  minitown:
    name: miniTown (TS)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: engines/miniTown
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: engines/miniTown/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: engines/miniTown/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: python -m pip install -e ../..
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm typecheck
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      # AID-1658 (hardening-top10 R7): AID-571 deterministic retry policy for
      # the miniTown smoke (script expanded here so the flags land on
      # `playwright test` itself). A retried test surfaces as a named "flaky"
      # entry in this log plus its on-first-retry trace (durable via the
      # artifact upload below); a real regression fails twice and still fails
      # the job. Recurrence on the same test escalates to quarantine + issue
      # (do not raise retries). Local stays retries: 0.
      - run: MINITOWN_PORT=5189 pnpm exec playwright test --retries=1 --trace on-first-retry
      - run: READINESS_TEST_RUN=passed node scripts/readiness-report.mjs
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: minitown-readiness-${{ github.sha }}
          path: engines/miniTown/test-results
          if-no-files-found: warn

  dojotoday:
    name: dojoToday (TS + substrate)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: engines/dojoToday
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: engines/dojoToday/package-lock.json
      # Match the other Python jobs (learner/minimax/openclaw): install from the
      # repo root with [dev] so selfcheck/prebuild always have fsrs + pyyaml.
      - run: python -m pip install -e ".[dev]"
        working-directory: .
      - run: npm ci
      - run: npm run selfcheck
      - run: npm run lint
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:readiness
      # This report contains automated facts only; observation assertions stay
      # with the independent assessor and cannot grant readiness in CI.
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: dojotoday-readiness-${{ github.sha }}
          path: engines/dojoToday/test-results
          if-no-files-found: warn

  product-readiness:
    name: product readiness (claims)
    needs: [literacydojo, codexdojo-os, dojotoday, pixeldojo, voxeldojo, minitown]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
      - run: mkdir -p artifacts/product-readiness
      - name: download producer reports and browser artifacts
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          pattern: "*-readiness-${{ github.sha }}"
          path: artifacts/product-readiness
          merge-multiple: true
      # AID-1669 (hardening R6): fail fast and unambiguously when no producer
      # report was downloaded, instead of letting an empty aggregation surface
      # later at `check` with stale-looking "lacks independent evidence"
      # errors. Genuine staleness only ever fails `check`/`enforce` below with
      # producer reports in hand — that is the re-grant-factory signal.
      - name: assert producer reports present
        run: |
          count=$(find artifacts/product-readiness -type f -name '*.json' ! -name 'product-readiness-report.json' | wc -l)
          if [ "$count" -eq 0 ]; then
            failed=""
            for pair in "literacydojo=${{ needs.literacydojo.result }}" \
                        "codexdojo-os=${{ needs.codexdojo-os.result }}" \
                        "dojotoday=${{ needs.dojotoday.result }}" \
                        "pixeldojo=${{ needs.pixeldojo.result }}" \
                        "voxeldojo=${{ needs.voxeldojo.result }}" \
                        "minitown=${{ needs.minitown.result }}"; do
              job="${pair%%=*}"; result="${pair##*=}"
              if [ "$result" != "success" ]; then failed="$failed $job=$result"; fi
            done
            echo "::error title=PRODUCER-REPORTS-MISSING::zero producer readiness reports downloaded; non-success producer jobs:${failed:- none}. NOT a stale-claims window: the readiness re-grant factory must not propose for this run."
            exit 1
          fi
          echo "producer readiness report files present: $count"
      - name: aggregate tested-SHA producer facts
        run: >-
          python3 docs/product-readiness/tools/cli.py aggregate
          --reports artifacts/product-readiness
          --output artifacts/product-readiness/product-readiness-report.json
      - name: validate readiness sources and candidate report
        id: readiness_check
        run: python3 docs/product-readiness/tools/cli.py check --reports artifacts/product-readiness
      # AID-1669: this annotation can only be reached with producer reports
      # present (assert above passed), so the failure above is the
      # stale-claims/invalid-candidate signal the factory exists for — clearly
      # distinct from PRODUCER-REPORTS-MISSING above.
      - name: annotate stale or invalid readiness failure
        if: failure() && steps.readiness_check.outcome == 'failure'
        run: echo "::error title=READINESS-STALE-OR-INVALID::producer reports were present, so the check failure above means claims are stale (or the candidate report is invalid). This IS the re-grant-factory signal."
      - name: enforce readiness claims without writes
        run: python3 docs/product-readiness/tools/cli.py enforce --reports artifacts/product-readiness
      - name: run readiness cli guard tests
        run: python3 -m pytest docs/product-readiness/tests -q
      - name: upload product-readiness-report.json
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: product-readiness-report-${{ github.sha }}
          path: artifacts/product-readiness/product-readiness-report.json
          if-no-files-found: warn

  curriculum-node:
    name: curriculum Node (18 projects)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: lint, test, and build every Node implementation
        run: |
          set -e
          for dir in curriculum/[0-9][0-9]_*/node-impl; do
            test -f "$dir/package.json" || continue
            # AID-1670 (hardening-top10 R10): install from the committed
            # lockfile so dependency resolution is reproducible; a missing or
            # out-of-sync lockfile fails here instead of flaking upstream.
            test -f "$dir/package-lock.json" || {
              echo "::error::$dir/package.json has no committed package-lock.json (AID-1670)"
              exit 1
            }
            echo "::group::$dir"
            (
              cd "$dir"
              npm ci --no-audit --no-fund
              npm run lint
              npm run test
              npm run build
            )
            echo "::endgroup::"
          done

  curriculum-go:
    name: curriculum Go
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - name: format, vet, and test rate-limiter pilot
        run: |
          set -e
          test -z "$(gofmt -l curriculum/01_rate_limiter/go-impl)"
          cd curriculum/01_rate_limiter/go-impl
          go vet ./...
          go test ./...

  curriculum-rust:
    name: curriculum Rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: format, lint, and test rate-limiter pilot
        run: |
          set -e
          cd curriculum/01_rate_limiter/rust-impl
          cargo fmt --check
          cargo clippy --all-targets -- -D warnings
          cargo test

  # TECH_DEBT_AUDIT_2026-07-08 item 8 — "no claims without evidence" was not
  # machine-enforced for the voxelDojo game-* packages. The root voxeldojo job
  # above is workspace-level only; this matrix runs lint/test/typecheck/build
  # per game so a single regressing game fails the PR with a clear pointer.
  voxeldojo-games-discover:
    name: voxelDojo games (discover)
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      # The matrix is generated from the game registry so a new game-* package
      # is CI-enforced the moment it lands in catalog.json — no second edit.
      - id: set
        run: echo "matrix=$(jq -c '[.[].id]' engines/voxelDojo/catalog.json)" >> "$GITHUB_OUTPUT"
  voxeldojo-games:
    name: voxelDojo games/${{ matrix.game }} (TS)
    needs: voxeldojo-games-discover
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        game: ${{ fromJSON(needs.voxeldojo-games-discover.outputs.matrix) }}
    defaults:
      run:
        # Games live in the voxelDojo workspace (pnpm-workspace.yaml packages:
        # ["game-*"]); install + filter commands are evaluated from the workspace
        # root so pnpm can resolve the per-game package.
        working-directory: engines/voxelDojo
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: engines/voxelDojo/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: engines/voxelDojo/pnpm-lock.yaml
      # Single install at the workspace root is hoisted to the pnpm store;
      # every matrix entry shares the same cache key (lockfile hash) so this
      # is a no-op on cache hit and the full workspace build on cache miss.
      - run: pnpm install --frozen-lockfile
      - name: lint
        run: pnpm --filter ${{ matrix.game }} lint
      - name: test
        run: pnpm --filter ${{ matrix.game }} test
      - name: typecheck
        run: pnpm --filter ${{ matrix.game }} typecheck
      - name: build
        run: pnpm --filter ${{ matrix.game }} build
      - run: pnpm exec playwright install --with-deps chromium
      # AID-1658 (hardening-top10 R7): AID-571 deterministic retry policy for
      # each game's smoke (every game-* smoke script is a plain
      # `playwright test`, so the flags pass straight through pnpm). A retried
      # test surfaces as a named "flaky" entry in this log plus its
      # on-first-retry trace; recurrence on the same test escalates to
      # quarantine + issue (do not raise retries).
      - name: smoke
        run: pnpm --filter ${{ matrix.game }} run smoke --retries=1 --trace on-first-retry
      # Durable half of the AID-571 contract for this matrix: keep the
      # on-first-retry traces (flaky evidence) as an artifact. Named
      # deliberately OUTSIDE the `*-readiness-${{ github.sha }}` pattern so
      # the product-readiness aggregation never ingests game test-results.
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: voxeldojo-games-flaky-traces-${{ matrix.game }}-${{ github.sha }}
          path: engines/voxelDojo/${{ matrix.game }}/test-results
          if-no-files-found: warn

  # TECH_DEBT_AUDIT_2026-07-08 item 8 — pixelDojo `games/*` siblings. The
  # canonical `pixel-quest/` is already covered by the root `pixeldojo` job
  # above; the matrix below targets any per-game workspace under `games/`.
  # As of 2026-07-08 the directory does not exist (only `pixel-quest/` is on
  # disk); discover emits an empty matrix (dependent job skips) plus a warning
  # annotation as the visible signal that the gap is open, without failing CI.
  pixeldojo-games-discover:
    name: pixelDojo games/* (discover)
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - id: set
        run: |
          set -euo pipefail
          games=()
          for pkg in engines/pixelDojo/games/*/package.json; do
            [ -f "$pkg" ] || continue
            dir=$(dirname "$pkg")
            name=$(basename "$dir")
            games+=("{\"dir\":\"$dir\",\"name\":\"$name\"}")
          done
          if [ ${#games[@]} -eq 0 ]; then
            echo "::warning::No engines/pixelDojo/games/* packages found — see TECH_DEBT_AUDIT_2026-07-08 item 8. The matrix enforces per-game lint/test/typecheck/build once the games land."
            echo "matrix=[]" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          matrix=$(printf '%s,' "${games[@]}")
          matrix="[${matrix%,}]"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "Discovered ${#games[@]} pixelDojo game(s)."
  pixeldojo-games:
    name: pixelDojo games/${{ matrix.game.name }} (TS)
    needs: pixeldojo-games-discover
    # An empty matrix FAILS the job at evaluation time ("Matrix vector 'game'
    # does not contain any values") instead of skipping it, and the failure is
    # invisible in the jobs list — so gate on the discover output to make the
    # no-games case a clean skip.
    if: ${{ needs.pixeldojo-games-discover.outputs.matrix != '[]' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        game: ${{ fromJSON(needs.pixeldojo-games-discover.outputs.matrix) }}
    defaults:
      run:
        # Each pixelDojo game is a standalone package today (no shared
        # workspace); install + scripts run from the game dir.
        working-directory: ${{ matrix.game.dir }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: ${{ matrix.game.dir }}/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: ${{ matrix.game.dir }}/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      # Per the audit: "run whichever of lint/test/typecheck/build the game's
      # package.json exposes." Missing scripts emit a warning instead of
      # silently passing — the audit's "no claims without evidence" rule.
      # Script presence is probed via package.json (jq), not by running the
      # script twice.
      - name: lint (warn if missing)
        run: |
          if jq -e '.scripts.lint' package.json >/dev/null; then pnpm run lint
          else echo "::warning::${{ matrix.game.name }} has no lint script"; fi
      - name: test (warn if missing)
        run: |
          if jq -e '.scripts.test' package.json >/dev/null; then pnpm run test
          else echo "::warning::${{ matrix.game.name }} has no test script"; fi
      - name: typecheck (warn if missing)
        run: |
          if jq -e '.scripts.typecheck' package.json >/dev/null; then pnpm run typecheck
          else echo "::warning::${{ matrix.game.name }} has no typecheck script"; fi
      - name: build (warn if missing)
        run: |
          if jq -e '.scripts.build' package.json >/dev/null; then pnpm run build
          else echo "::warning::${{ matrix.game.name }} has no build script"; fi

  # TECH_DEBT_AUDIT_2026-07-08 item 8 — openclaw was not CI-enforced. Runs
  # the pytest island (file-based checklist runner, simulate-grade per
  # ADR-0002) and the read-only preview CLI. The cleanliness assertion guards
  # the canonical learner source against accidental writes during smoke runs.
  openclaw:
    name: openclaw (checklist runner)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
      - name: openclaw unit tests
        run: python -m pytest engines/openclaw/tests -q
      - name: openclaw read-only smoke
        run: |
          python -m engines.openclaw --preview
          test -z "$(git status --porcelain -- learner/)"

  # TECH_DEBT_AUDIT_2026-07-08 item 8 — aiDevschoolMvp installer + acceptance
  # tests were in pyproject.toml testpaths but only ran as part of the
  # monolithic `python` job above; this isolates the failure signal.
  aiDevschoolMvp:
    name: aiDevschoolMvp (installer + acceptance)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -q engines/aiDevschoolMvp/tests

  # TECH_DEBT_AUDIT_2026-07-08 item 8 — split out of the monolithic `python`
  # job above so a regression in the tutor core points at the right engine
  # without forcing the reviewer to re-run everything.
  minimaxDojo:
    name: minimaxDojo (tutor core)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest engines/minimaxDojo/tests -q

  miniMaxEvolutionEngine:
    name: miniMaxEvolutionEngine (supervisor)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest engines/miniMaxEvolutionEngine/tests -q

  # DESIGN.md contract (2026-09-12): every frontend engine owns a DESIGN.md
  # (Stitch spec: YAML front matter tokens + prose) derived from its real CSS.
  # This job lints changed DESIGN.md files with the official linter so visual
  # tokens are treated as code. Zero-error policy: warnings are allowed
  # (orphaned tokens are expected in reference analyses), errors fail the job.
  design-md-lint:
    name: DESIGN.md lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Collect changed DESIGN.md files
        id: collect
        run: |
          BASE="${SDLC_BASE:-origin/main}"
          FILES=$(git diff --name-only --diff-filter=ACMR "$BASE"...HEAD -- '*DESIGN.md' '**.DESIGN.md' | grep -v node_modules || true)
          echo "files<<EOF" >> "$GITHUB_OUTPUT"
          echo "$FILES" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"
          echo "Changed DESIGN.md files:"
          echo "${FILES:-<none>}"
      - name: Lint changed DESIGN.md files
        if: steps.collect.outputs.files != ''
        run: |
          set -euo pipefail
          echo "${{ steps.collect.outputs.files }}" | while IFS= read -r f; do
            [ -f "$f" ] || continue
            echo "::group::lint $f"
            npx -y @google/design.md lint "$f" | tee "/tmp/$(basename "$f").lint.json"
            if [ "$(python3 -c "import json;print(json.load(open('/tmp/$(basename "$f").lint.json'))['summary']['errors'])")" != "0" ]; then
              echo "::error file=$f::design.md lint reported errors"
              exit 1
            fi
            echo "::endgroup::"
          done
