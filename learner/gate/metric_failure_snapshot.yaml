# Metric-failure snapshot: which metric names emitted by the teaching games
# are failure indicators. Source of truth for standards.game_metric_violations
# (derived at import) and guarded by `python3 -m learner.gate.metric_lint --check` in CI.
#
# classifications: failure(nonzero) | failure(true) | not_failure | unknown
# provenance:      receipt:<digest16> (a committed judgment receipt) | manual:<who>
#
# Seed (2026-09-17): legacy frozenset names carry manual:legacy-frozensets;
# every other name was classified by a live judgment sweep (receipt
# 518d6905b440cc43 — see learner/judgment_receipts/) and hand-reviewed:
# twenty overrides marked manual:seed-review-2026-09-17 correct metrics that
# describe correct behavior or scenario composition, not learner failure.
