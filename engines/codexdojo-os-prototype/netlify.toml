# Preview estático do Engine Lab. Os runtimes são sites separados e entram
# somente pelas variáveis VITE_*_URL configuradas no provedor.

[build]
  command = "npm run build:pilot"
  publish = "dist"
  # Staged inside the site root by scripts/build-pilot-bundle.mjs from the
  # canonical learner/gate/netlify-functions source. The verifier function is
  # a projection: never edit netlify/functions by hand.
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "22"
  NPM_FLAGS = "--include=dev"
  # Ativação O1 (ordem AID-910/D / AID-913, decisão §4 do ADR-0010): liga o
  # transporte same-origin do OS para o coletor staged nesta mesma rota. O
  # secret de EXPORT (ANALYTICS_EXPORT_TOKEN) é configurado só no provedor.
  VITE_ANALYTICS_ENDPOINT = "/__dojo/bridge/v1/analytics"

[[redirects]]
  # Same-origin verification bridge (AID-305): route the Dev-journey verifier
  # ahead of the SPA fallback so verification stays independent and available.
  from = "/__dojo/bridge/v1/session"
  to = "/.netlify/functions/dojo-verification-bridge"
  status = 200

[[redirects]]
  from = "/__dojo/bridge/v1/verification"
  to = "/.netlify/functions/dojo-verification-bridge"
  status = 200

[[redirects]]
  # Same-origin analytics collector (AID-470 F1 / ADR-0010; ativação AID-913):
  # receives the OS v1 batches. The browser transport emits to this exact
  # same-origin path (VITE_ANALYTICS_ENDPOINT above); cross-origin POSTs are
  # rejected by the collector (sec-fetch-site gate).
  from = "/__dojo/bridge/v1/analytics"
  to = "/.netlify/functions/dojo-analytics-collector"
  status = 200

[[redirects]]
  # The OS does not own a root service worker. Keep stale probes out of the SPA
  # fallback; LiteracyDojo's worker is scoped to /apps/literacydojo/sw.js.
  from = "/sw.js"
  to = "/404.html"
  status = 404

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    Referrer-Policy = "strict-origin"
    X-Content-Type-Options = "nosniff"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' https:; frame-src https:; object-src 'none'; base-uri 'self'; frame-ancestors 'self'"
