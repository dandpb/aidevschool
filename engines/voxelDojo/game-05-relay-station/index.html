<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RELAY STATION — voxelDojo game 05</title>
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      body { margin: 0; display: flex; height: 100vh; background: #0b0e14; color: #e6e9f2;
             font-family: ui-monospace, "Cascadia Mono", Menlo, monospace; }
      #stage { flex: 1 1 0; min-width: 0; width: 100%; height: 100%; display: block; }
      .accessible-stage { flex: 1; min-width: 0; overflow-y: auto; padding: clamp(20px, 5vw, 64px); background:
        radial-gradient(circle at 80% 10%, #20384a 0, transparent 34%), #0b0e14; }
      .accessible-stage[hidden] { display: none; }
      .accessible-projection { max-width: 760px; margin: auto; padding: clamp(20px, 4vw, 40px); border: 1px solid #4fc3f7;
        border-radius: 18px; background: #101827; box-shadow: 0 12px 0 #05070b; }
      .accessible-projection__eyebrow { color: #80cbc4; font-size: 12px; font-weight: 800; text-transform: uppercase; letter-spacing: .1em; }
      .accessible-projection h2 { font-size: clamp(24px, 4vw, 42px); }
      .accessible-projection li { margin: 8px 0; color: #aab3cc; }
      .accessible-projection__controls { display: flex; flex-wrap: wrap; gap: 8px; margin: 22px 0; }
      .accessible-projection button { min-height: 44px; padding: 9px 12px; border: 1px solid #4fc3f7; border-radius: 8px;
        background: #1a2030; color: #e6e9f2; font: inherit; cursor: pointer; }
      #hud { width: 340px; padding: 16px; overflow-y: auto; border-left: 1px solid #3d4663;
             display: flex; flex-direction: column; gap: 10px; }
      #hud h1 { font-size: 18px; margin: 0; }
      #hud .lesson { color: #aab3cc; margin: 0; }
      #hud .rule { color: #7f8ab0; font-size: 12px; margin: 0; }
      #hud .status { min-height: 3em; color: #ffd54f; }
      #hud button { background: #1a2030; color: #e6e9f2; border: 1px solid #3d4663; border-radius: 6px;
                    padding: 8px 10px; margin: 2px; cursor: pointer; font: inherit; text-align: left; }
      #hud button:hover { border-color: #4fc3f7; }
      #hud .swatch { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 6px; }
      #hud .incoming { color: #4fc3f7; }
      #hud .metrics { font-size: 11px; color: #aab3cc; white-space: pre-wrap; }
      #hud input[type="range"] { width: 100%; }
      :focus-visible { outline: 3px solid #ffd54f; outline-offset: 3px; }
      @media (max-width: 720px) { body { flex-direction: column; } #hud { width: 100%; max-height: 48vh; border-left: 0; border-top: 1px solid #3d4663; } }
    </style>
  </head>
  <body>
    <canvas id="stage"></canvas>
    <aside id="hud"></aside>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
