<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Estação de retransmissão — voxelDojo jogo 05</title>
    <style>
      :root {
        color-scheme: dark;
        /* Papéis semânticos engine-local (contrato de design §3.1; valores são do voxelDojo). */
        --vd-bg: #0b0e14;
        --vd-surface: #101827;
        --vd-surface-control: #1a2030;
        --vd-text: #e6e9f2;
        --vd-muted: #aab3cc;
        --vd-faint: #7f8ab0;
        --vd-border: #3d4663;
        --vd-action: #4fc3f7;
        --vd-focus: #ffd54f;
        --vd-success: #a5d6a7;
        --vd-error: #ef5350;
        --vd-glow: #20384a;
        --vd-edge-shadow: #05070b;
        --vd-hud-width: 340px;
        --vd-target: 44px;
      }
      * { box-sizing: border-box; }
      body { margin: 0; display: flex; height: 100vh; background: var(--vd-bg); color: var(--vd-text);
             font-family: ui-monospace, "Cascadia Mono", Menlo, monospace; }
      #stage { flex: 1 1 0; min-width: 0; width: 100%; height: 100%; display: block; }
      .accessible-stage { flex: 1; min-width: 0; overflow-y: auto; padding: clamp(20px, 5vw, 64px); background:
        radial-gradient(circle at 80% 10%, var(--vd-glow) 0, transparent 34%), var(--vd-bg); }
      .accessible-stage[hidden] { display: none; }
      .accessible-projection { max-width: 760px; margin: auto; padding: clamp(20px, 4vw, 40px); border: 1px solid var(--vd-action);
        border-radius: 18px; background: var(--vd-surface); box-shadow: 0 12px 0 var(--vd-edge-shadow); }
      .accessible-projection__eyebrow { color: #80cbc4; font-size: 12px; font-weight: 800; text-transform: uppercase; letter-spacing: .1em; }
      .accessible-projection h2 { font-size: clamp(24px, 4vw, 42px); }
      .accessible-projection li { margin: 8px 0; color: var(--vd-muted); }
      .accessible-projection__controls { display: flex; flex-wrap: wrap; gap: 8px; margin: 22px 0; }
      .accessible-projection button { min-height: var(--vd-target); padding: 9px 12px; border: 1px solid var(--vd-action); border-radius: 8px;
        background: var(--vd-surface-control); color: var(--vd-text); font: inherit; cursor: pointer; }
      #hud { width: var(--vd-hud-width); padding: 16px; overflow-y: auto; border-left: 1px solid var(--vd-border);
             display: flex; flex-direction: column; gap: 10px; }
      #hud h1 { font-size: 18px; margin: 0; }
      #hud .lesson { color: var(--vd-muted); margin: 0; }
      #hud .rule { color: var(--vd-faint); font-size: 12px; margin: 0; }
      #hud .status { min-height: 3em; color: var(--vd-focus); }
      #hud button { background: var(--vd-surface-control); color: var(--vd-text); border: 1px solid var(--vd-border); border-radius: 6px;
                    min-height: var(--vd-target); min-width: var(--vd-target); padding: 8px 10px; margin: 2px; cursor: pointer;
                    font: inherit; text-align: left; }
      #hud button:hover { border-color: var(--vd-action); }
      #hud .swatch { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 6px; }
      #hud .incoming { color: var(--vd-action); }
      #hud .metrics { font-size: 11px; color: var(--vd-muted); white-space: pre-wrap; overflow-wrap: anywhere; }
      #hud input[type="range"] { width: 100%; }
      :focus-visible { outline: 3px solid var(--vd-focus); outline-offset: 3px; }
      @media (max-width: 720px) { body { flex-direction: column; } #hud { width: 100%; max-height: 48vh; border-left: 0; border-top: 1px solid var(--vd-border); } }
      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after {
          animation: none !important;
          transition: none !important;
          scroll-behavior: auto !important;
        }
      }
    </style>
  </head>
  <body>
    <canvas id="stage" role="img" aria-label="Palco WebGL do jogo 05 do voxelDojo: estação de retransmissão em 3D">Sem WebGL, use a projeção acessível abaixo.</canvas>
    <aside id="hud"></aside>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
