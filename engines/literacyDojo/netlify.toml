[build]
  command = "npm run build"
  publish = "dist"
  functions = "../../learner/gate/netlify-functions"

[build.environment]
  VITE_LITERACY_VERIFIER_URL = "/.netlify/functions/literacy-verify"
  # Ativação O1 (ordem AID-910/D / AID-913): batch analytics same-origin para
  # o coletor em learner/gate/netlify-functions/dojo-analytics-collector.mjs.
  # Valor autorizado é exatamente este caminho — drift é travado por teste
  # (services.analytics.test.ts). O secret de EXPORT (ANALYTICS_EXPORT_TOKEN)
  # é configurado só no provedor, nunca no repo.
  VITE_ANALYTICS_ENDPOINT = "/__dojo/bridge/v1/analytics"

[[redirects]]
  # Same-origin analytics collector (ativação AID-913 / ADR-0009+0010): recebe
  # os batches do envelope literacy v2. A função já é deployada via
  # `functions = ../../learner/gate/netlify-functions`; a rota segue o padrão
  # da ponte de verificação (same-origin imposto no coletor).
  from = "/__dojo/bridge/v1/analytics"
  to = "/.netlify/functions/dojo-analytics-collector"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  # Paridade de headers de segurança com o codexdojo-os (QW2 AID-1593,
  # doc web-audit AID-1584 §6/§7): a superfície literacyDojo não tinha
  # nenhum deles. Política idêntica à de engines/codexdojo-os-prototype/
  # netlify.toml, com um delta justificado: worker-src 'self', porque o
  # literacyDojo registra um service worker em produção
  # (src/main.tsx -> navigator.serviceWorker.register, sw.js em public/);
  # o OS não tem worker próprio, por isso o dele não precisa.
  for = "/*"
  [headers.values]
    Referrer-Policy = "strict-origin"
    X-Content-Type-Options = "nosniff"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' https:; frame-src https:; object-src 'none'; base-uri 'self'; frame-ancestors 'self'; worker-src 'self'"
